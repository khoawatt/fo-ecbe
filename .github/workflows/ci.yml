name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fo_ecbe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fo_ecbe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: fo_ecbe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm ls
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run migration:show
      - run: npm run migration:cli:smoke
      - run: npm run migration:run
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run migration:show:prod
      - name: Verify production startup
        run: |
          npm run start:prod > /tmp/fo-ecbe-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/fo-ecbe-startup.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/fo-ecbe-startup.log
          exit 1
